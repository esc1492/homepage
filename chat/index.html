<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미키 챗봇</title>
<style>
  :root {
    --color-canvas-parchment: #f7f7f4;
    --color-inkwell: #262510;
    --color-muted-stone: #7a7974;
    --color-pebble-gray: #e6e5e0;
    --color-highlight-beige: #cdcdc9;
    --radius-cards: 4px;

    --font-primary: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-primary);
    background: var(--color-canvas-parchment);
    color: var(--color-inkwell);
    font-size: 14px;
    line-height: 1.6;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 56px 16px 0;
  }

  header {
    padding: 22px 0 12px;
    border-bottom: 1px solid var(--color-pebble-gray);
    flex-shrink: 0;
  }

  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 12px; color: var(--color-muted-stone); margin-top: 2px; }

  /* === SiteNav (홈페이지 .nav와 동일 디자인) === */
  .sitenav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    height: 56px;
    background: rgba(247, 247, 244, 0.75);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border-bottom: 1px solid rgba(38, 37, 16, 0.06);
  }

  .sitenav-brand {
    display: flex;
    align-items: center;
    height: 20px;
    cursor: pointer;
    padding: 4px;
  }

  .sitenav-brand .triple-line {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 18px;
  }

  .sitenav-brand .triple-line .line {
    width: 100%;
    height: 2.5px;
    background: var(--color-inkwell);
    border-radius: 1px;
  }

  .sitenav-right {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sitenav-door {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 36px;
    cursor: pointer;
    color: var(--color-inkwell);
  }
  .sitenav-door .door-open { opacity: 1; }

  .sitenav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 42px;
    color: var(--color-muted-stone);
    opacity: 0.25;
  }
  .sitenav-icon.logged-in {
    opacity: 1;
    color: #1a3a8a;
  }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg { display: flex; gap: 8px; align-items: flex-start; }

  .msg .avatar {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .msg .text {
    background: #fff;
    border: 1px solid var(--color-pebble-gray);
    border-radius: var(--radius-cards);
    padding: 9px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 100%;
  }

  .msg.user { flex-direction: row-reverse; }
  .msg.user .text { background: var(--color-inkwell); color: var(--color-canvas-parchment); border-color: var(--color-inkwell); }

  #composer {
    display: flex;
    gap: 8px;
    padding: 12px 0 18px;
    border-top: 1px solid var(--color-pebble-gray);
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 9px 12px;
    border: 1px solid var(--color-highlight-beige);
    border-radius: var(--radius-cards);
    background: #fff;
    color: var(--color-inkwell);
    resize: none;
    height: 42px;
    max-height: 160px;
  }

  #input:focus { outline: none; border-color: var(--color-inkwell); }

  #send {
    font-family: inherit;
    font-size: 14px;
    padding: 0 18px;
    height: 42px;
    border: none;
    border-radius: var(--radius-cards);
    background: var(--color-inkwell);
    color: var(--color-canvas-parchment);
    cursor: pointer;
    flex-shrink: 0;
  }

  #send:disabled { opacity: 0.4; cursor: default; }

  #gate {
    margin: auto;
    text-align: center;
    padding: 40px 20px;
  }

  #gate .icon { font-size: 34px; }
  #gate h2 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; }
  #gate p { font-size: 13px; color: var(--color-muted-stone); }

  #gate a {
    display: inline-block;
    margin-top: 18px;
    padding: 9px 18px;
    background: var(--color-inkwell);
    color: var(--color-canvas-parchment);
    border-radius: var(--radius-cards);
    text-decoration: none;
    font-size: 14px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<nav class="sitenav" aria-label="사이트 내비게이션">
  <span class="sitenav-brand" id="homeBtn" title="홈페이지로 이동">
    <span class="triple-line"><span class="line"></span><span class="line"></span><span class="line"></span></span>
  </span>
  <span class="sitenav-right">
    <span class="sitenav-door" id="backBtn" title="뒤로 가기">
      <svg class="door-open" viewBox="0 0 27 36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="27" height="36">
        <rect x="3" y="4.5" width="18" height="27" rx="1.5"/>
        <path d="M3 6 L13.5 9 L13.5 27 L3 30"/>
        <path d="M11.5 18 H8.5"/>
        <circle cx="11.5" cy="18" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="sitenav-icon" id="userBtn" title="로그인 상태">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="42">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </span>
  </span>
</nav>
<div class="app">
  <header>
    <h1>🐭 미키 챗봇</h1>
    <p>AI 비서 미키입니다.</p>
  </header>

  <div id="gate" class="hidden">
    <div class="icon">🔒</div>
    <h2>로그인이 필요합니다</h2>
    <p>미키는 시작 페이지에 로그인한 뒤에 사용하실 수 있습니다.</p>
    <a href="/">시작 페이지로 돌아가기</a>
  </div>

  <div id="thread"></div>

  <form id="composer" class="hidden">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요..."></textarea>
    <button id="send" type="submit">전송</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* === SiteNav: 햄버거=홈으로, 문=뒤로가기(실패 시 홈으로) === */
(function(){
  document.getElementById('homeBtn').addEventListener('click', function(){
    window.location.href = '/';
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/';
  });
})();
</script>
<script>
(function(){
  var SUPABASE_URL = 'https://oggzgullnohqehthewuw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_XVSK5Evl0W64_7h-XLZ1cQ_rnzo3qMC';

  // 기존 Streamlit 앱(chatbot_app.py)과 같은 값입니다.
  var MAX_HISTORY = 20;

  var GREETING = '안녕하세요! 저는 미키입니다. 😊\n\n무엇을 도와드릴까요?';

  var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // API 로 보낼 대화 이력. 첫 메시지가 반드시 user 여야 하므로 인사말은 넣지 않습니다
  // (인사말은 아래에서 화면에만 그립니다).
  var history = [];
  var accessToken = null;
  var sending = false;

  var gateEl = document.getElementById('gate');
  var threadEl = document.getElementById('thread');
  var composerEl = document.getElementById('composer');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');

  function bubble(role, text){
    var row = document.createElement('div');
    row.className = 'msg ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '🐭' : '🧑';

    var body = document.createElement('div');
    body.className = 'text';
    body.textContent = text;

    row.appendChild(avatar);
    row.appendChild(body);
    threadEl.appendChild(row);
    threadEl.scrollTop = threadEl.scrollHeight;
    return row;
  }

  function showGate(){
    gateEl.classList.remove('hidden');
    threadEl.classList.add('hidden');
    composerEl.classList.add('hidden');
  }

  function showChat(){
    gateEl.classList.add('hidden');
    threadEl.classList.remove('hidden');
    composerEl.classList.remove('hidden');
    if (!threadEl.childElementCount) bubble('assistant', GREETING);
  }

  function setSending(on){
    sending = on;
    sendEl.disabled = on;
    inputEl.disabled = on;
  }

  async function send(text){
    if (sending) return;
    setSending(true);

    var userRow = bubble('user', text);
    history.push({ role: 'user', content: text });

    var assistantRow = bubble('assistant', '');
    var body = assistantRow.querySelector('.text');

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'Authorization': 'Bearer ' + accessToken
        },
        body: JSON.stringify({ messages: history.slice(-MAX_HISTORY) })
      });

      if (res.status === 401){
        // 화면과 이력을 함께 되돌립니다. 한쪽만 지우면 어긋납니다.
        assistantRow.remove();
        userRow.remove();
        history.pop();
        showGate();
        return;
      }

      if (!res.ok){
        body.textContent = await res.text();
        return;
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var full = '';

      for(;;){
        var chunk = await reader.read();
        if (chunk.done) break;
        full += decoder.decode(chunk.value, { stream: true });
        body.textContent = full;
        threadEl.scrollTop = threadEl.scrollHeight;
      }

      history.push({ role: 'assistant', content: full });
    } catch(err){
      body.textContent = '오류가 발생했습니다: ' + err.message;
    } finally {
      setSending(false);
      inputEl.focus();
    }
  }

  composerEl.addEventListener('submit', function(e){
    e.preventDefault();
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = '42px';
    send(text);
  });

  // Enter 로 전송, Shift+Enter 로 줄바꿈
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      composerEl.requestSubmit();
    }
  });

  inputEl.addEventListener('input', function(){
    inputEl.style.height = '42px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // 홈페이지와 같은 Supabase 세션을 그대로 씁니다 (같은 origin).
  sbClient.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if (session){
      accessToken = session.access_token;
      document.getElementById('userBtn').classList.add('logged-in');
      showChat();
    } else {
      showGate();
    }
  });
})();
</script>
</body>
</html>
